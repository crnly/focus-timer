name: Check browser app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check timer.js
          node --check cycle.js
      - name: Test timer and browser flows
        run: node --test tests/*.test.cjs
